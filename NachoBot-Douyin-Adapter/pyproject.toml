[project]
name = "nachobot-douyin-adapter"
version = "0.1.0"
description = "Official Douyin live-data and private-message adapter for NachoBot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.11",
    "fastapi>=0.115",
    "loguru>=0.7.3",
    "tomlkit>=0.13",
    "uvicorn[standard]>=0.30",
    "websockets>=12,<17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
