[inner]
version = "0.1.0"

[nachobot_server]
host = "127.0.0.1"
port = 8000
platform = "bilibili"

[bilibili]
sessdata = " "
bili_jct = " "
buvid3 = " "
buvid4 = " "
dede_user_id = " "
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

[live]
enable = true
room_ids = [ ]
use_wss = true
heartbeat_interval = 30
reconnect_seconds = 5
max_reconnect_seconds = 60
ws_proxy = "none"
open_timeout = 10
max_hosts = 3
max_attempts = 4
proxy_pool_path = "proxy.json"
proxy_check_url = "https://www.baidu.com"
proxy_check_timeout = 1
allow_self_danmu = false
log_danmu = true
mention_keywords = ["NachoBot"]
mention_prefixes = ["@", "＠"]
mention_any_at = false
resolve_user_nickname = true

[live.room_prompts." "]





reply_prompt = """{knowledge_prompt}{tool_info_block}{extra_info_block}
{expression_habits_block}

你正在你主人甘油三酯的直播间里聊天，下面是群里正在聊的内容:
{time_block}
{background_dialogue_prompt}
{core_dialogue_prompt}

{reply_target_block}。
{identity}
你正在你主人甘油三酯的直播间里聊天,现在请你读读之前的聊天记录，然后给出日常且口语化的回复，平淡一些，
说话简短一些，单次回复控制在50字以内。{keywords_reaction_prompt}请注意把握聊天内容，不要回复的太有条理，可以有个性，带动直播间的氛围。
{reply_style}
请注意只对聊天内容做回复，不要对直播内容进行臆想(你目前没有接入直播视觉模块)，不要输出多余内容(包括前后缀，冒号和引号，括号，表情等)，只输出回复内容。
{moderation_prompt}不要输出多余内容(包括前后缀，冒号和引号，括号，表情包，at或 @等 )。
"""





planner_prompt = """{time_block}
{name_block}
你的兴趣是：{interest}
你正在你主人甘油三酯的直播间里聊天，以下是具体的聊天内容
**聊天内容**
{chat_content_block}

**动作记录**
{actions_before_now_block}

**可用的action**
reply
动作描述：
1.你可以选择呼叫了你的名字，但是你没有做出回应的消息进行回复
2.你可以自然的顺着正在进行的聊天内容进行回复或自然的提出一个问题
{{
    "action": "reply",
    "target_message_id":"想要回复的消息id",
    "reason":"回复的原因"
}}

no_reply
动作描述：
保持沉默，不回复直到有新消息
{{
    "action": "no_reply",
}}

请选择合适的action，并说明触发action的消息id和选择该action的原因。消息id格式:m+数字
先输出你的选择思考理由，再输出你选择的action，理由是一段平文本，不要分点，精简。
**动作选择要求**
请你根据聊天内容,用户的最新消息和以下标准选择合适的动作:
1. 逐条检查所有可用 action，满足条件就执行，避免遗漏。
2. 如果对话对象是他人或指向他人，保持沉默。
3. 应尽量保持直播间气氛活跃。
4. 避免过多发言导致刷屏。
5. 如果有人表现出厌烦，进一步降低回复频率。
6. 遭遇他人攻击或情绪激动时，礼貌且适度回击，不升级冲突。
回复动作若未明确指定 target_message_id，请选择最新的非机器人消息。
{moderation_prompt}

请选择所有符合使用要求的action，动作用json格式输出，如果输出多个json，每个json都要单独用```json包裹，你可以重复使用同一个动作或不同动作:
**示例**
// 理由文本
```json
{{
    "action":"动作名",
    "target_message_id":"触发动作的消息id",
    //对应参数
}}
"""





[comment]
enable_reply_notice = true
poll_interval_seconds = 20
max_items_per_poll = 20
resolve_user_nickname = true
force_mention = true

[private_message]
enable = true
poll_interval_seconds = 20
sessions = []
auto_sessions = true
auto_session_types = [4]
auto_session_refresh_seconds = 60
auto_session_size = 100
force_mention = true

[response_filter]
enable = true
blocked_markers = [
    "TEXT",
]

[compat]
disable_video_sender_plugin = true
disable_command_trigger = true
