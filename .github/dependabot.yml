version: 2

updates:
  - package-ecosystem: "uv"
    directories:
      - "NachoBot"
      - "NachoBot-Bilibili-Adapter"
      - "NachoBot-DiscordVC-Adapter"
      - "NachoBot-Koishi-Adapter"
      - "NachoBot-Live2D-Adapter"
      - "NachoBot-Multimodal-Adapter"
      - "NachoBot-Napcat-Adapter"
      - "NachoBot-UniversalVC-Adapter"
      - "webUI"

    schedule:
      interval: "monthly"

    target-branch: "dev"

    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torchvision"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"

  - package-ecosystem: "npm"
    directory: "/koishi-app"
    schedule:
      interval: "monthly"
    target-branch: "dev"
