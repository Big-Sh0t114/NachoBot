name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.5"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Reject Python syntax errors and undefined names
        run: uvx --from ruff==0.12.2 ruff check . --select E9,F63,F7,F82

      - name: Parse every tracked Python and TOML file
        shell: python
        run: |
          import ast
          import pathlib
          import subprocess
          import tomllib

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.py", "*.toml"],
              text=True,
          ).splitlines()
          for name in tracked:
              path = pathlib.Path(name)
              # config-save contains legacy, intentionally half-filled snapshots
              # (for example a blank `room_id =`) rather than deployable TOML.
              if path.parts and path.parts[0] == "config-save":
                  continue
              if path.suffix == ".py":
                  ast.parse(path.read_text(encoding="utf-8-sig"), filename=name)
              else:
                  with path.open("rb") as stream:
                      tomllib.load(stream)

      - name: Parse every tracked JavaScript file
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')

      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          git diff --check "$base" "$GITHUB_SHA"

  locks:
    name: Lock file (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - NachoBot
          - NachoBot-Bilibili-Adapter
          - NachoBot-Discord-Adapter
          - NachoBot-Live2D-Adapter
          - NachoBot-Multimodal-Adapter
          - NachoBot-Napcat-Adapter
          - NachoBot-UniversalVC-Adapter
          - webUI
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.5"

      - name: Verify lock is current
        working-directory: ${{ matrix.project }}
        run: uv lock --check

      - name: Verify Core resolves for Linux
        if: matrix.project == 'NachoBot'
        working-directory: NachoBot
        run: >-
          uv sync --locked --no-dev --no-install-project --dry-run
          --python-platform x86_64-unknown-linux-gnu

      - name: Verify generated requirements export
        if: matrix.project == 'NachoBot'
        working-directory: NachoBot
        run: |
          uv export --locked --no-dev --no-hashes --output-file requirements.txt
          git diff --exit-code -- requirements.txt

  discord-adapter-tests:
    name: Discord Adapter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.5"

      - name: Install locked dependencies
        working-directory: NachoBot-Discord-Adapter
        run: uv sync --locked

      - name: Run offline unit tests
        working-directory: NachoBot-Discord-Adapter
        run: uv run --locked python -m unittest discover -s tests

  security-regressions:
    name: Focused security regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.5"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run WebUI security and middleware regressions
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with fastapi --with httpx --with uvicorn
          --with tomlkit --with psutil --with websockets --with pydantic
          python -m unittest webUI.tests.test_security_regressions
          webUI.tests.test_security webUI.tests.test_config_manager_security

      - name: Check SnowLuma frontend contract
        run: node webUI/tests/snowluma_frontend_contract.test.js

      - name: Run Core API and legacy digest regressions
        working-directory: NachoBot
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with httpx --with beautifulsoup4 --with json5 --
          python -m pytest -q tests/test_maizone_qzone_api.py
          tests/test_legacy_digest_ids.py

      - name: Run lightweight Multimodal API regressions
        working-directory: NachoBot-Multimodal-Adapter
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with fastapi --with pydantic --with httpx --with toml
          --with numpy --with scipy --with uvicorn --with requests --with aiohttp
          --with python-multipart --with loguru --
          python -m pytest -q tests/test_local_runtime.py
          tests/test_gpt_fixed_api.py tests/test_vox_path_security.py
          tests/test_api_error_safety.py tests/test_tts_runtime_supervisor.py
          tests/test_tts_dependency_security.py

      # The Vox test stubs NumPy/Torch at import time, so this job does not install
      # Torch or download model/GPU runtimes.

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate every tracked Compose file
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            docker compose --file "$file" config --quiet
          done < <(git ls-files -z '**/docker-compose.yml' 'docker-compose.yml')


  core-image:
    name: Core container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- NachoBot ':!NachoBot/**/*.md' ':!NachoBot/tests/**'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Core image
        if: steps.changes.outputs.build == 'true'
        run: docker build --tag nachobot-core-ci:latest NachoBot

  multimodal-image:
    name: Multimodal container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          adapter='NachoBot-Multimodal-Adapter'
          if git diff --quiet "$base" "$GITHUB_SHA" --               "$adapter"               ":!$adapter/**/*.md"               ":!$adapter/tests/**"               && git diff --quiet "$base" "$GITHUB_SHA" --               NachoBot               ':!NachoBot/**/*.md'               ':!NachoBot/tests/**'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Multimodal image
        if: steps.changes.outputs.build == 'true'
        run: >-
          docker build --tag nachobot-multimodal-adapter-ci:latest
          --file NachoBot-Multimodal-Adapter/dockerfile
          --build-context nachobot=NachoBot
          NachoBot-Multimodal-Adapter

  napcat-image:
    name: NapCat container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          adapter='NachoBot-Napcat-Adapter'
          if git diff --quiet "$base" "$GITHUB_SHA" --               "$adapter"               ":!$adapter/**/*.md"               ":!$adapter/tests/**"               && git diff --quiet "$base" "$GITHUB_SHA" --               NachoBot               ':!NachoBot/**/*.md'               ':!NachoBot/tests/**'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the NapCat image
        if: steps.changes.outputs.build == 'true'
        run: >-
          docker build --tag nachobot-napcat-adapter-ci:latest
          --file NachoBot-Napcat-Adapter/Dockerfile
          --build-context nachobot=NachoBot
          NachoBot-Napcat-Adapter
