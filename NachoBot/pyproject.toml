[project]
name = "NachoBot"
version = "0.9.2"
description = "NachoCore 是一个基于大语言模型的可交互智能体"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.13.3",
    "cryptography>=50.0.0",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.11.0",
    "fastapi>=0.140.13",
    "google-genai>=1.39.1",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "json-repair>=0.60.1",
    "jsonlines>=4.0.0",
    "json5>=0.10.0",
    "mcp>=2.0.0",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openai>=2.50.0",
    "packaging>=25.0",
    "pandas>=2.3.1",
    "peewee>=3.18.2",
    "pillow>=12.2.0",
    "playwright>=1.55.0",
    "psutil>=7.0.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.11.7",
    "pymongo>=4.13.2",
    "pypinyin>=0.54.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2023.3",
    "python-dotenv>=1.2.2",
    "python-igraph>=0.11.9",
    "quick-algo>=0.1.3",
    "rapidfuzz>=3.9.6",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "ruff>=0.12.2",
    "scipy>=1.15.3",
    "static-ffmpeg>=3.0,<4.0",
    "setuptools>=80.9.0",
    "structlog>=25.4.0",
    "toml>=0.10.2",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "tomlkit>=0.13.3",
    "tqdm>=4.67.1",
    "urllib3>=2.7.0",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
    "rsilk>=0.1.4",
    "pywin32>=311; sys_platform == 'win32'",
    "loguru>=0.7.3",
    "tenacity>=8.0.0",
]


[tool.ruff]

include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 如果一个变量的名称以下划线开头，即使它未被使用，也不应该被视为错误或警告。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
]

ignore = ["E711","E501"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"


# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"

[tool.uv.extra-build-dependencies]
rsilk = ["setuptools_rust"]

