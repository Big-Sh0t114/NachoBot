services:
  adapters:
    container_name: nacho-bot-adapters
    image: unclas/nachobot-adapter:latest
    profiles: ["legacy-adapters"]
    environment:
      - TZ=Asia/Shanghai
#    ports:
#      - "8095:8095"
    volumes:
      - type: bind
        source: ./docker-config/adapters/config.toml
        target: /adapters/config.toml
        bind:
          create_host_path: false
      - type: bind
        source: ./data/adapters
        target: /adapters/data
        bind:
          create_host_path: false
    restart: always
    networks:
      - nacho_bot
  core:
    container_name: nacho-bot-core
    build:
      context: .
      dockerfile: Dockerfile
    image: nachobot-core:local
    environment:
      - TZ=Asia/Shanghai
      - NACHOBOT_CORE_TOKEN=${NACHOBOT_CORE_TOKEN:-}
      - HOST=0.0.0.0
      - PORT=8000
        # Core 仅在本 Compose 管理的网络中为适配器提供无令牌通信。
      # 若将端口暴露到非回环地址，必须删除此开关并配置 auth_token。
      - NACHOBOT_TRUSTED_CONTAINER_NETWORK=1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./docker-config/mmc/.env
        target: /NachoBot/.env
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-config/mmc
        target: /NachoBot/config
        bind:
          create_host_path: false
      - type: bind
        source: ./data/NachoBot/nachobot_statistics.html
        target: /NachoBot/nachobot_statistics.html
        bind:
          create_host_path: false
      - type: bind
        source: ./data/NachoBot
        target: /NachoBot/data
        bind:
          create_host_path: false
      - type: bind
        source: ./data/NachoBot/logs
        target: /NachoBot/logs
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nacho_bot
  napcat:
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - type: bind
        source: ./docker-config/napcat
        target: /app/napcat/config
        bind:
          create_host_path: false
      - type: bind
        source: ./data/qq
        target: /app/.config/QQ
        bind:
          create_host_path: false
      - type: bind
        source: ./data/NachoBot
        target: /NachoBot/data
        bind:
          create_host_path: false
    container_name: nacho-bot-napcat
    restart: always
    image: mlikiowa/napcat-docker:latest
    networks:
      - nacho_bot
  sqlite-web:
    # 注意：coleifer/sqlite-web 镜像不支持arm64
    image: coleifer/sqlite-web
    container_name: sqlite-web
    profiles: ["debug"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:8080"
    volumes:
      - type: bind
        source: ./data/NachoBot
        target: /data/NachoBot
        read_only: true
        bind:
          create_host_path: false
    environment:
      - SQLITE_DATABASE=NachoBot/NachoBot.db  # 你的数据库文件
    networks:
      - nacho_bot

  # chat2db占用相对较高但是功能强大
  # 内存占用约600m，内存充足推荐选此
  # chat2db:
  #   image: chat2db/chat2db:latest
  #   container_name: nacho-bot-chat2db
  #   restart: always
  #   ports:
  #     - "10824:10824"
  #   volumes:
  #     - ./data/nachoBot:/data/nachoBot
  #   networks:
  #     - nacho_bot
  
networks:
  # 同一 Docker daemon 上加入此网络的容器都处于 Core 的受信任边界内。
  # 网络名保持为 nacho_bot，供其他适配器 Compose 以 external: true 加入。
  nacho_bot:
    name: nacho_bot
