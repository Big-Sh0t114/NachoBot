[model_task_config.utils] # 一些组件中使用的模型，例如表情包模块，取名模块，关系模块，情绪变化等，是必须的模型
model_list = ["Qwen/Qwen3-8B","THUDM/glm-4-9b-chat","Qwen/Qwen2.5-7B-Instruct"] # 使用的模型列表，每个子项对应上面的模型名称(name)
temperature = 0.2                        # 模型温度，新V3建议0.1-0.3
max_tokens = 800                         # 最大输出token数

[model_task_config.utils_small] # 一些组件中使用的小模型，消耗量较大，建议使用速度较快的小模型
model_list = ["Qwen/Qwen3-8B","THUDM/glm-4-9b-chat","Qwen/Qwen2.5-7B-Instruct"]
temperature = 0.2
max_tokens = 800

[model_task_config.tool_use] #工具调用模型，需要使用支持工具调用的模型
model_list = ["gpt-4o-mini","Qwen/Qwen3-8B","THUDM/glm-4-9b-chat","Qwen/Qwen2.5-7B-Instruct"]
temperature = 0.05
max_tokens = 800

[model_task_config.file_edit] # 文件编辑/代码生成专用模型
model_list = ["gpt-5.3-codex","gpt-5.2-codex","gpt-5.1-codex"]
temperature = 0.1
max_tokens = 4096
timeout = 50

[model_task_config.mcp] # MCP插件专用模型配置
model_list = ["grok-4.1-thinking"]
temperature = 0.05
max_tokens = 800

[model_task_config.web_search] # 联网搜索模型组
model_list = ["waifubot-search","gemini-2.5-flash#search"]
temperature = 0.2
max_tokens = 800

[model_task_config.replyer] # 首要回复模型，还用于表达器和表达方式学习
model_list = ["claude-sonnet-4-5-20250929","gemini-2.5-flash"]
temperature = 0.5                        
max_tokens = 800

[model_task_config.advanced_replyer] # 高级模式回复模型组（可选，未配置则回退replyer）
# 在此填写高级模式使用的模型名称列表
model_list = ["grok-4.1-thinking","grok-4-fast-expert","grok-4-fast","grok-3"]
temperature = 0.5
max_tokens = 800

[model_task_config.planner] #决策：负责决定该什么时候回复的模型
model_list = ["gpt-4.1-mini","Qwen/Qwen3-8B","Qwen/Qwen2.5-7B-Instruct","THUDM/glm-4-9b-chat"]
temperature = 0.05
max_tokens = 800

[model_task_config.vlm] # 图像识别模型（核心聊天图片/表情包描述）
model_list = ["waifubot-view","florence-2-large"]
max_tokens = 800

[model_task_config.bilibili_vlm] # Bilibili 直播画面识别（本地 Florence-2）
model_list = ["florence-2-large"]
max_tokens = 114514

[model_task_config.video] # 视频识别模型
model_list = ["gemini-2.0-flash","gemini-2.5-flash","waifubot-view-video"]
max_tokens = 4096

[model_task_config.voice] # 语音识别模型（本地 FunASR）
model_list = ["sensevoice-small"]

#嵌入模型
[model_task_config.embedding]
model_list = ["bge-m3","BAAI/bge-large-zh-v1.5"]

#------------LPMM知识库模型------------

[model_task_config.lpmm_entity_extract] # 实体提取模型
model_list = ["siliconflow-deepseek-v3"]
temperature = 0.2
max_tokens = 800

[model_task_config.lpmm_rdf_build] # RDF构建模型
model_list = ["siliconflow-deepseek-v3"]
temperature = 0.2
max_tokens = 800

[model_task_config.lpmm_qa] # 问答模型
model_list = ["qwen3-30b"]
temperature = 0.7
max_tokens = 800
