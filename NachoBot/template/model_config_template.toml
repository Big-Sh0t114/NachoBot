[model_task_config.utils] # 一些组件中使用的模型，例如表情包模块，取名模块，关系模块，情绪变化等，是必须的模型
model_list = ["deepseek-ai/DeepSeek-R1-0528-Qwen3-8B/Silicon","deepseek-ai/DeepSeek-R1-Distill-Qwen-7B/Silicon","THUDM/GLM-Z1-9B-0414/Silicon"] # 使用的模型列表，每个子项对应上面的模型名称(name)
temperature = 0.2                        # 模型温度，新V3建议0.1-0.3
max_tokens = 800                         # 最大输出token数

[model_task_config.utils_small] # 一些组件中使用的小模型，消耗量较大，建议使用速度较快的小模型
model_list = ["Qwen/Qwen3-8B/Silicon","Qwen/Qwen2.5-7B-Instruct/Silicon","THUDM/GLM-Z1-9B-0414/Silicon"]
temperature = 0.2
max_tokens = 800

[model_task_config.tool_use] #工具调用模型，需要使用支持工具调用的模型
model_list = ["Qwen/Qwen3-8B/Silicon","Qwen/Qwen2.5-7B-Instruct/Silicon","THUDM/GLM-Z1-9B-0414/Silicon"]
temperature = 0.05
max_tokens = 800

[model_task_config.file_edit] # 文件编辑/代码生成专用模型，建议使用能力较强的模型
model_list = ["deepseek-v4-pro"]
temperature = 0.1
max_tokens = 8192
timeout = 50

[model_task_config.mcp] # MCP插件专用模型配置
model_list = []
temperature = 0.05
max_tokens = 800

[model_task_config.replyer0] # 默认回复模型组（原 replyer），还用于表达器和表达方式学习
model_list = ["deepseek-v4-flash"]
temperature = 0.5                        
max_tokens = 800

[model_task_config.replyer1] # 备用回复模型组，可通过 #switch_rpygroup 切换
model_list = []
temperature = 0.5
max_tokens = 800

[model_task_config.replyer2] # 备用回复模型组2
model_list = []
temperature = 0.5
max_tokens = 800

[model_task_config.private_replyer0] # 私聊默认回复模型组
model_list = []
temperature = 0.5
max_tokens = 800

[model_task_config.private_replyer1] # 私聊备用回复模型组1
model_list = []
temperature = 0.5
max_tokens = 800

[model_task_config.private_replyer2] # 私聊备用回复模型组2
model_list = []
temperature = 0.5
max_tokens = 800

[model_task_config.advanced_replyer] # 高级模式回复模型组（可选，未配置则回退replyer）
model_list = ["deepseek-v4-pro"]
temperature = 0.5
max_tokens = 800

[model_task_config.planner] #决策：负责决定该什么时候回复的模型
model_list = ["Qwen/Qwen3-8B/Silicon","THUDM/GLM-Z1-9B-0414/Silicon","Qwen/Qwen2.5-7B-Instruct/Silicon"]
temperature = 0.05
max_tokens = 800

[model_task_config.private_planner] #私聊专属独立规划模型组（可选，缺省回退到默认参数/planner）
model_list = []
temperature = 0.05
max_tokens = 800

[model_task_config.vlm] # 图像识别模型（核心聊天图片/表情包描述）
model_list = ["Qwen/Qwen3.5-4B/Silicon","Florence-2"]
max_tokens = 800

[model_task_config.bilibili_vlm] # Bilibili 直播画面识别
model_list = ["Florence-2"]
max_tokens = 114514

[model_task_config.bilibili_replyer] # Bilibili 直播间专属独立回复模型组
model_list = ["deepseek-v4-pro"]
temperature = 0.5
max_tokens = 800

[model_task_config.video] # 视频识别模型，模型需支持多模态
model_list = [""]
max_tokens = 4096

[model_task_config.voice] # 语音识别模型
model_list = ["sensevoice-small/Silicon","FunAudioLLM/SenseVoiceSmall/Silicon"]

#嵌入模型（注意：不要在此填入多个模型，因为不同模型的向量维度和语义空间不同，混用会导致检索完全失效。更换模型前必须清空现有的向量数据库）
[model_task_config.embedding]
model_list = ["bge-m3/Silicon"]

#------------LPMM知识库模型------------

[model_task_config.lpmm_entity_extract] # 实体提取模型
model_list = [""]
temperature = 0.2
max_tokens = 800

[model_task_config.lpmm_rdf_build] # RDF构建模型
model_list = [""]
temperature = 0.2
max_tokens = 800

[model_task_config.lpmm_qa] # 问答模型
model_list = [""]
temperature = 0.7
max_tokens = 800
