[pipeline]
# pipeline预设配置
default_preset = "default" # 默认使用的预设名称

# pipeline平台预设映射
[pipeline.platform_presets]
qq = "default"       # QQ平台使用default预设
discord = "default"  # Discord平台使用default预设

[tts]
# VoxCPM Gradio WebUI 配置
host = "127.0.0.1"
port = 9880

# VoxCPM 基础模型。留空时由托管运行时自动下载 openbmb/VoxCPM2
model_dir = ""

# LoRA 权重路径（可使用任意本地自定义权重；留空则不使用LoRA）
lora_weights_path = ""

# 默认生成参数
cfg_value = 3.0               # CFG 引导强度
inference_timesteps = 10       # LocDiT 流匹配迭代步数
normalize = false              # 是否进行文本规范化
seed = -1               # 随机种子，-1 为随机

# 文本切句配置（防止长句音色漂移）
# cut0: 不切分  cut1: 仅句号/问号/感叹号  cut2: +逗号/顿号
# cut3: +分号/冒号/省略号(默认)  cut4: 按字数强制切  cut5: 标点+字数
split_method = "cut3"
max_split_length = 80          # cut4/cut5 模式下每段最大字符数
segment_gap_ms = 100           # 句间静音间隔（毫秒），0 为不插入

# 角色预设
[tts.models]
[tts.models.presets]
[tts.models.presets.default]
name = "default"
ref_audio_path = "default.wav"    # 参考音频路径（与GPT-SoVITS共享），留空则为Voice Design模式
control_instruction = ""              # 可选声音描述（留空则纯克隆）
prompt_text = ""                      # 极致克隆模式的参考音频文本（留空则不启用极致克隆）
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

[tts.models.presets.disgust]     #情感配置
name = "disgust"
ref_audio_path = "disgust.wav"
control_instruction = ""
prompt_text = ""
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

[tts.models.presets.caring]
name = "caring"
ref_audio_path = "caring.WAV"
control_instruction = ""
prompt_text = ""
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

[tts.models.presets.sleepy]
name = "sleepy"
ref_audio_path = "sleepy.WAV"
control_instruction = ""
prompt_text = ""
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

[tts.models.presets.happy]
name = "happy"
ref_audio_path = "happy.WAV"
control_instruction = ""
prompt_text = ""
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

[tts.models.presets.sad]
name = "sad"
ref_audio_path = "sad.WAV"
control_instruction = ""
prompt_text = ""
cfg_value = 3.0
inference_timesteps = 10
normalize = false
seed = -1

# ===== 情感分类系统 =====
[emotion]
# 启用情感分类（仅 Vox 生效）
enabled = true

# 固定使用 TabularisAI 多语种 11 类多标签情绪分类模型
classifier_model = "tabularisai/multilingual-emotion-classification"

# 分类器运行设备（"cpu" 或 "cuda:0" 等）
classifier_device = "cpu"

# 是否使用 FP16 半精度推理（仅 CUDA 设备有效，CPU 自动回退 FP32）
use_fp16 = true

# 最高概率低于此值时回退到默认预设
confidence_threshold = 0.6

# 默认预设
# 必须与 [tts.models.presets.<name>] 中的预设名一致
default_emotion = "default"

# TabularisAI 固定 11 类标签到 Vox 预设的映射。
# 键名固定为模型标签；值可按需要改为任意已有 Vox 预设。
[emotion.label_preset_map]
anger = "disgust"
contempt = "disgust"
disgust = "disgust"
fear = "sad"
frustration = "disgust"
gratitude = "caring"
joy = "happy"
love = "caring"
neutral = "default"
sadness = "sad"
surprise = "happy"
