[perception]
# Perception API 服务配置（独立于 TTS 引擎）
host = "127.0.0.1"
port = 9874

[perception.device]
# 视觉模型硬件配置
vlm = "cuda:0"   # Florence-2 VLM 使用的设备

[asr]
# 所有 Adapter 共用的 sherpa-onnx 流式 ASR
mode = "local_streaming"
provider = "cpu"
device = 0
num_threads = 4
models_dir = "models"
auto_download = true
