[project]
name = "NachoBotMultimodalAdapter"
version = "0.3.1"
description = "A multimodal TTS, ASR, and VLM adapter for NachoBot"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.14.0",
    "cryptography>=50.0.0",
    "einops>=0.8.2",
    "fastapi>=0.135.1",
    "loguru>=0.7.3",
    "numpy",
    "onnxruntime>=1.27.0",
    "openai>=2.50.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydub>=0.25.1",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.17.1",
    "sherpa-onnx>=1.13.4",
    "sherpa-onnx-core==1.13.4",
    "soundfile>=0.12.1",
    "static-ffmpeg>=3.0,<4.0",
    "timm>=1.0.25",
    "toml>=0.10.2",
    "torch==2.7.1+cu118",
    "torchaudio==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
    "transformers==5.14.0",
    "uvicorn>=0.41.0",
    "websockets>=12.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[tool.ruff]

include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
]

ignore = ["E711","E501"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"


# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"
