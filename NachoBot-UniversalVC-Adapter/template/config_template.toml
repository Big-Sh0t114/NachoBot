log_level = "INFO"

disable_network_search = true

[capture]
# Target process to capture audio from.
# Use EITHER target_pid (exact PID) OR target_process_name (e.g. "VRChat.exe").
# Leave both empty to capture system-wide audio (loopback mode).
# target_pid = 12345
target_process_name = "VRChat.exe"

# System-wide capture device (only used when target_process_name is empty).
# system_capture_device = "Stereo Mix"
# system_capture_device = "Voicemeeter Out B1"

# Legacy VAD settings (used as fallback if Silero VAD fails to load)
vad_threshold = 500
silence_threshold = 0.8
min_speech_duration = 0.3

[output]
# Virtual audio cable output device name.
device_name = "VoiceMeeter Input (VB-Audio VoiceMeeter VAIO)"
sample_rate = 44100

[nachobot]
host = "localhost"
port = 8000

# ── Real-time Audio Pipeline ───────────────────────────────────────

[denoise]
# Real-time denoising (DeepFilterNet). Removes background noise, game SFX, BGM.
enabled = false

[vad]
# Silero VAD (neural-network-based, replaces simple RMS threshold)
threshold = 0.5
min_silence_duration = 0.25
min_speech_duration = 0.3

[speaker]
# Real-time speaker tracking with voiceprint database
enabled = true
similarity_threshold = 0.5
max_speakers = 24  # Set to 0 for unlimited
db_path = "speaker_db.json"

[microphone]
enabled = true
device_name = "HECATE G4 S PRO"
# Fixed identity for microphone speaker
owner_speaker_id = "owner"
owner_speaker_name = "主人"
# Push-to-talk: only capture mic when key is held down
push_to_talk = true
ptt_key = "caps_lock"  # Key to hold (e.g. "v", "ctrl", "alt", "shift", "caps_lock")

# ── Prompts ─────────────────────────────────────────────────────────

[prompts]
replyer_prompt = """{identity}
你当前正在 {application_name} 的语音频道中，
现在请你读读之前的聊天记录，然后给出日常且口语化的回复，平淡一些，
说话简短一些，单次回复控制在50字以内。请注意把握聊天内容，不要回复的太有条理，可以有个性。
{reply_style}
请严格只输出一个 JSON 对象，不要 Markdown、代码围栏或额外解释，格式为：
{"reply":"给用户看的显示文本","tts_text":"要播放的中文语音文本"}
其中 reply 是给聊天记录显示的简短回复，tts_text 是明确交给 Core TTS 的中文文本；两者通常相同，也可以让显示文本和朗读文本略有不同。两个字段都必须是非空字符串。
tts_text 将经过 Core TTS 作为语音播放，请使用规范的标点，使用逗号和句号断句，不要使用"~"等语气符，颜文字不可用来代替逗号或句号断句。

下面是语音通话的内容:
{background_dialogue_prompt}
{core_dialogue_prompt}
{time_block}

{reply_target_block}。{keywords_reaction_prompt}
{expression_habits_block}
{moderation_prompt}
"""
