log_level = "INFO"

disable_network_search = true

[capture]
# Target process to capture audio from.
# Use EITHER target_pid (exact PID) OR target_process_name (e.g. "VRChat.exe").
# Leave both empty to capture system-wide audio (loopback mode).
# target_pid = 12345
target_process_name = ""

# System-wide capture device (only used when target_process_name is empty).
# system_capture_device = "Stereo Mix"

# Legacy VAD settings (used as fallback if Silero VAD fails to load)
vad_threshold = 500
silence_threshold = 0.8
min_speech_duration = 0.3

[output]
# Virtual audio cable output device name.
#   "CABLE Input"          - VB-Audio Virtual Cable
#   "VoiceMeeter Input"    - VoiceMeeter
device_name = "CABLE Input"
sample_rate = 44100

[nachobot]
host = "localhost"
port = 8000

# ── DEV: Real-time Audio Pipeline ──────────────────────────────────

[denoise]
# Real-time denoising via DeepFilterNet (removes noise, game SFX, BGM)
enabled = true

[vad]
# Silero VAD (neural-network-based, replaces simple RMS threshold)
threshold = 0.5
min_silence_duration = 0.25
min_speech_duration = 0.3

[speaker]
# Real-time speaker tracking with voiceprint database
enabled = true
similarity_threshold = 0.6
max_speakers = 8
db_path = "speaker_db.json"

[local_asr]
# Local streaming ASR (sherpa-onnx Zipformer Chinese)
# mode = "local_streaming"  — ultra-low latency, runs locally
# mode = "remote_api"       — fallback to HTTP ASR API (needs [stt] config)
mode = "local_streaming"
num_threads = 2

[microphone]
# Microphone capture for owner voice input.
# When enabled, captures audio from the local microphone and fixes the speaker
# identity as "owner" (主人), bypassing speaker tracking for mic input.
enabled = false
# Microphone device name (leave empty for system default microphone)
# device_name = "Microphone (Realtek High Definition Audio)"
device_name = ""
# Fixed identity for microphone speaker
owner_speaker_id = "owner"
owner_speaker_name = "主人"

# ── Prompts ─────────────────────────────────────────────────────────

[prompts]
replyer_prompt = """{identity}
你当前正在 {application_name} 的语音频道中，
现在请你读读之前的聊天记录，然后给出日常且口语化的回复，平淡一些，
说话简短一些，单次回复控制在50字以内。请注意把握聊天内容，不要回复的太有条理，可以有个性。
{reply_style}
不要输出多余内容(包括前后缀，冒号和引号，括号，表情等)，只输出回复内容。
你输出的回复将经过TTS作为语音被播放出来，请使用规范的标点，使用逗号和句号断句，不要使用"~"等语气符，颜文字不可用来代替逗号或句号断句。

下面是语音通话的内容:
{background_dialogue_prompt}
{core_dialogue_prompt}
{time_block}

{reply_target_block}。{keywords_reaction_prompt}
{expression_habits_block}
{moderation_prompt}
"""
