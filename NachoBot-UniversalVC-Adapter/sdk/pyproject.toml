[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nachobot-universalvc-client"
version = "0.1.0"
description = "Lightweight frozen public client for the UniversalVC service"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14.4,<4"]

[tool.setuptools]
py-modules = ["universalvc_client"]
