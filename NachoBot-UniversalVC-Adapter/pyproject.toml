[project]
name = "nachobot-universalvc-adapter"
version = "0.2.0"
description = "NachoBot Universal Voice Channel Adapter - Real-time Denoise + Speaker Diarization + Core multimodal perception"
requires-python = ">=3.11"
dependencies = [
    "proc-tap",
    "aiohttp>=3.14.4,<4",
    "numpy",
    "scipy",
    "tomlkit",
    "psutil",
    "sounddevice",
    "requests",
    "toml",
    "sherpa-onnx>=1.13.4",
    "static-ffmpeg>=3.0,<4.0",
    "pyrnnoise",
    "onnxruntime>=1.27.0",
    "pynput",
    "websockets",
    "cryptography>=50.0.1",
    "fastapi",
    "loguru>=0.7.3",
    "uvicorn>=0.53.0",
]

[tool.ruff]
target-version = "py311"
