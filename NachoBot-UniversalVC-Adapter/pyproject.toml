[project]
name = "nachobot-universalvc-adapter"
version = "0.2.0"
description = "NachoBot Universal Voice Channel Adapter - Real-time Denoise + Speaker Diarization + Streaming ASR"
requires-python = ">=3.11"
dependencies = [
    "proc-tap",
    "aiohttp",
    "numpy",
    "scipy",
    "tomlkit",
    "psutil",
    "sounddevice",
    "requests",
    "toml",
    "sherpa-onnx>=1.13.4",
    "static-ffmpeg>=3.0,<4.0",
    "pyrnnoise",
    "onnxruntime>=1.27.0",
    "pynput",
    "websockets",
    "cryptography",
    "fastapi",
    "loguru>=0.7.3",
    "uvicorn",
]
