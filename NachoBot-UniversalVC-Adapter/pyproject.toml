[project]
name = "nachobot-universalvc-adapter-dev"
version = "0.2.0"
description = "NachoBot Universal Voice Channel Adapter (DEV) - Real-time Denoise + Speaker Diarization + Streaming ASR"
requires-python = ">=3.10"
dependencies = [
    "proc-tap",
    "numpy",
    "scipy",
    "aiohttp",
    "tomlkit",
    "websockets",
    "psutil",
    "sounddevice",
    "uvicorn",
    "fastapi",
    "starlette",
    "cryptography",
    "requests",
    "toml",
    "pydub",
    "loguru",
    "sherpa-onnx",
    "pyrnnoise",
    "onnxruntime>=1.20",
]
