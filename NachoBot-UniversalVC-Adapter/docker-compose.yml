services:
  universal-vc-adapter:
    container_name: nacho-bot-universal-vc-adapter
    platform: windows/amd64
    build:
      context: .
      additional_contexts:
        nachobot: ../NachoBot
    environment:
      - TZ=Asia/Shanghai
      - NACHOBOT_CORE_TOKEN=${NACHOBOT_CORE_TOKEN:-}
      - NACHOBOT_CORE_HOST=core
      - NACHOBOT_CORE_PORT=8000
    volumes:
      - type: bind
        source: ./config.toml
        target: C:/workspace/NachoBot-UniversalVC-Adapter/config.toml
      - type: bind
        source: ./models
        target: C:/workspace/NachoBot-UniversalVC-Adapter/models
      - type: bind
        source: ./speaker_db.json
        target: C:/workspace/NachoBot-UniversalVC-Adapter/speaker_db.json
      - type: bind
        source: ../NachoBot/config
        target: C:/workspace/NachoBot/config
        read_only: true
    restart: always
    networks:
      - nacho_bot

networks:
  nacho_bot:
    external: true
