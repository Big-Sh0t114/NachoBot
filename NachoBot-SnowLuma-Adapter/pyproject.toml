[project]
name = "NachoBotSnowLumaAdapter"
version = "0.2.0"
description = "SnowLuma adapter for NachoBot Core using ncnk_message"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nachobot-qqcall-client",
    "aiohttp>=3.14.4,<4",
    "cryptography>=50.0.1",
    "fastapi>=0.140.13",
    "loguru>=0.7.3",
    "starlette>=1.3.1",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
qqcall-audio = [
    "nachobot-qqcall-pcm",
]

[tool.uv.sources]
nachobot-qqcall-client = { path = "../NachoBot-QQCall/sdk", editable = true }
nachobot-universalvc-client = { path = "../NachoBot-UniversalVC-Adapter/sdk", editable = true }
nachobot-qqcall-pcm = { path = "../NachoBot-QQCall", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
