[project]
name = "nachobot-local-host-adapter"
version = "0.1.0"
description = "Local-only AI virtual host control panel for NachoBot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.11",
    "cryptography>=43",
    "edge-tts>=7.2",
    "fastapi>=0.115",
    "kokoro-onnx>=0.6.0",
    "loguru>=0.7.3",
    "soundfile>=0.13",
    "tomlkit>=0.13",
    "uvicorn[standard]>=0.30",
    "websockets>=12,<17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
