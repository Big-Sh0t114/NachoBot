# Independent Live2D application settings. Paths are relative to this file.
[server]
host = "127.0.0.1"
port = 8766
token = ""

[runtime]
mode = "live"

[renderer]
model_path = "resources/NachoBot/Nachobot.model3.json"
transparent = true
antialiasing = true
width = 1400
height = 1200
scale = 1.0
track_mouse = false
poke_cooldown_seconds = 10.0

# Explicit --preview selects this separate provider-debug viewer surface.
[viewer]
model_path = "resources/NachoBot/Nachobot.model3.json"
width = 800
height = 1000
scale = 1.0
fps = 60
hidden = false
antialiasing = true

[adaptation]
enabled = true

# Optional model-specific overrides. Parameter values can be one ID or a list.
# [adaptation.parameters]
# MOUTH_OPEN = ["ParamMouthOpenY"]

# [adaptation.expressions]
# joy = "f01"

[actions]
NOD = "Nod"
SHAKE_HEAD = "Shake"
TURN_LEFT = "TurnLeft"
TURN_RIGHT = "TurnRight"
WINK = "Wink"
HAPPY = "Sway"
TILT_HEAD = "TiltHead"
LOOK_AWAY = "LookAway"

[logging]
level = "INFO"
