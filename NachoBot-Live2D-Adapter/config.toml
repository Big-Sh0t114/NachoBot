[server]
host = "127.0.0.1"
port = 8766
# 留空表示仅依赖本机监听地址；需要鉴权时同时配置 Bilibili 侧令牌。
token = ""

[runtime]
# desktop_pet：透明桌宠与独立聊天窗；live：仅启动直播/推流用 Live2D 窗口与 WebSocket。
mode = "desktop_pet"

[renderer]
# 相对于本配置文件所在目录解析。
model_path = "resources/hiyori_test/runtime/hiyori_pro_t11.model3.json"
transparent = true
antialiasing = true
width = 520
height = 760
scale = 0.9
track_mouse = true
poke_cooldown_seconds = 4.0

# mode = "desktop_pet" 时启用以下设置；mode = "live" 时自动忽略桌宠窗口行为。
[desktop_pet]
title = "桃濑日和 · NachoBot 桌宠"
character_name = "日和"
chat_header = "桃濑日和 · NachoBot"
always_on_top = true
hide_from_taskbar = true
click_through = false
remember_position = true
state_path = "state/desktop_pet_state.json"
start_position = "bottom_right"
margin = 24
min_scale = 0.45
max_scale = 1.8
# The Live2D viewport stays inside this fixed transparent window.  When true,
# zooming is capped before the model can be clipped by the window edges.
fit_to_window = true
tray_icon = true
left_click_motion = "Tap"
double_click_motion = "FlickUp"
right_click_motion = "Flick"
idle_motion_groups = ["Flick", "FlickDown", "FlickUp", "Tap", "Tap@Body", "Flick@Body"]
idle_motion_min_seconds = 18.0
idle_motion_max_seconds = 40.0

[desktop_pet.chat]
enabled = true
transport = "core"
core_url = "ws://127.0.0.1:8000/ws"
# 留空沿用 Core 当前回复模型；可填 Core 中已配置的模型组名称。
core_reply_model_group = ""
# 快速神经语音需要网络；multimodal 使用本机 Vox 等 TTS 服务。
tts_provider = "neural"
tts_voice = "zh-CN-XiaoxiaoNeural"
tts_rate = "-10%"
tts_url = "http://127.0.0.1:9880"
# transport = "http" 时兼容已有 Local Host，桌宠默认直接连接 Core。
backend_url = "http://127.0.0.1:8789"
# Keep the chat as an independent companion window. Set true only if a docked
# chat that follows the character is preferred.
follow_pet = false
remember_position = true
window_state_path = "state/desktop_pet_chat_state.json"
request_timeout_seconds = 8.0
# 直接 Core 请求超时后丢弃迟到回复，不会误归到下一条消息。
reply_timeout_seconds = 60.0
poll_interval_seconds = 0.5
play_audio = true
tts_language = "auto"
max_input_chars = 500
history_path = "state/desktop_pet_chat_history.json"
max_history_messages = 100

# 默认在内存中扫描模型参数、表情和动作名称，不改写用户模型文件。
[adaptation]
enabled = true

# 自动识别不明确时可在这里覆盖；单个参数可写字符串，多个联动参数可写数组。
# [adaptation.parameters]
# MOUTH_OPEN = ["ParamMouthOpenY"]

# [adaptation.expressions]
# normal = "normal"
# shy = "shy"
# disgust = "disgust"
# angry = "angry"

# Canonical action ID -> 当前 Live2D 模型中的 Motion Group。
# 模型的实际分组名称不一致时，只需修改此表，无需改 NachoBot 或平台适配器。
[actions]
NOD = "FlickDown"
SHAKE_HEAD = "Flick"
TURN_LEFT = "Tap@Body"
TURN_RIGHT = "Flick@Body"
WINK = "Tap"
HAPPY = "FlickUp"
TILT_HEAD = "Tap"
LOOK_AWAY = "Tap@Body"

[logging]
level = "INFO"
