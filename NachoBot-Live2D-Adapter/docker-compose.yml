services:
  live2d-adapter:
    container_name: nacho-bot-live2d-adapter
    platform: windows/amd64
    build:
      context: .
    environment:
      - TZ=Asia/Shanghai
      - NACHOBOT_LIVE2D_HOST=0.0.0.0
      - NACHOBOT_LIVE2D_PORT=8766
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - type: bind
        source: ./config.toml
        target: C:/workspace/NachoBot-Live2D-Adapter/config.toml
      - type: bind
        source: ./resources
        target: C:/workspace/NachoBot-Live2D-Adapter/resources
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection = socket.create_connection(('127.0.0.1', 8766), 3); connection.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nacho_bot

networks:
  nacho_bot:
    external: true
