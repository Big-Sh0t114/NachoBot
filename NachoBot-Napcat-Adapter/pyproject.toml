[project]
name = "NachoBotNapcatAdapter"
version = "0.5.5"
description = "A NachoBot adapter for Napcat"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nachobot-qqcall-client",
    "aiohttp>=3.14.0",
    "cryptography>=50.0.0",
    "fastapi>=0.140.13",
    "loguru>=0.7.3",
    "pillow>=12.2.0",
    "rich>=14.3.3",
    "sqlmodel>=0.0.37",
    "tomlkit>=0.14.0",
    "urllib3>=2.0.0",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
qqcall-audio = [
    "nachobot-qqcall-pcm",
]

[tool.uv.sources]
nachobot-qqcall-client = { path = "../NachoBot-QQCall/sdk", editable = true }
nachobot-universalvc-client = { path = "../NachoBot-UniversalVC-Adapter/sdk", editable = true }
nachobot-qqcall-pcm = { path = "../NachoBot-QQCall", editable = true }

[tool.ruff]

include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
]

ignore = ["E711","E501"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"


# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"
