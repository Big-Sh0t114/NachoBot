# diary_plugin - 自动生成的配置文件
# 让麦麦能够回忆和记录每一天的聊天，生成个性化的日记内容(适配0.10.0及以上)

# 插件基础配置
[plugin]

# 是否启用插件
enabled = true

# 配置文件版本
config_version = "2.2.4"

# 管理员QQ号列表,用于使用测试命令 (示例:[111,222])
admin_qqs = [ ]

# 是否注册并启用 DiaryGeneratorAction
enable_action = true

# 是否注册并启用 EmotionAnalysisTool
enable_tool = true

# 是否注册并启用 DiaryManageCommand
enable_command = true


# 日记生成相关配置
[diary_generation]

# 生成日记所需的最少消息总数
min_message_count = 50

# 单个群组聊天条数少于此值时该群组消息不参与日记生成
min_messages_per_chat = 25

# 生成样式: diary | qqzone | custom
style = "diary"

# 当 style=custom 时使用的模板。可用占位符: {date},{timeline},{date_with_weather},{target_length},{personality_desc},{style},{interest},{name}
custom_prompt = ""

# 是否开启回复改写
enable_syle_send = false


# QQ空间发布配置
[qzone_publishing]

# 最小字数，范围20-8000
qzone_min_word_count = 150

# 最大字数，范围20-8000，必须≥最小值
qzone_max_word_count = 500

# Napcat服务地址,Docker环境可使用'napcat'
napcat_host = "127.0.0.1"

# Napcat服务端口
napcat_port = "9997"

# Napcat服务认证Token,在Napcat WebUI的网络配置中设置,为空则不使用token
napcat_token = "114514"


# 自定义模型配置（仅支持OpenAI格式）
[custom_model]

use_custom_model = false
api_url = "https://api.qhaigc.net/v1"
api_key = " "
model_name = "deepseek-chat"
temperature = 0.7
api_timeout = 300
max_context_tokens = 114514


# 定时任务配置
[schedule]

# 每日生成日记的时间 (HH:MM格式)
schedule_time = "23:30"

# 时区设置
timezone = "Asia/Shanghai"

# 过滤模式，可选值：whitelist(白名单), blacklist(黑名单)
filter_mode = "whitelist"

# 目标列表，格式：["group:群号", "private:用户qq号"]
# 示例：["group:123456789", "private:987654321"]
# 白名单模式：空列表=禁用定时任务，有内容=只处理列表中的聊天
# 黑名单模式：空列表=处理全部聊天，有内容=处理除列表外的聊天
target_chats = [" "]


