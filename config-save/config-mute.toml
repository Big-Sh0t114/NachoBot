# group_muter_plugin - 自动生成的配置文件
# 一个允许管理员通过聊天命令，让麦麦在指定群聊中临时进入“静音状态”的群组管理插件。

# 插件基本设置
[plugin]

# 插件名称
name = "group_muter_plugin"

# 插件版本
version = "1.4.0"

# 是否启用此插件
enabled = true


# 静音功能相关配置
[mute]

# 命令未指定时的默认静音时长（秒），用于 #mute
duration_seconds = 300

# 触发静音的关键词列表
mute_keywords = ['#mute_true']

# 解除静音的关键词列表
unmute_keywords = ['#mute_false']

# 是否启用 '解除静音' 关键词指令
enable_unmute = true

# 管理员@麦麦时是否自动解除静音
at_mention_break = true


# 权限控制
[user_control]

# 权限列表类型
# 可选值: whitelist, blacklist
list_type = "whitelist"

# 拥有权限的用户QQ号列表
list = [' ']


