# 要禁用的工具名（每行一个）
disabled_tools = '''
mcp_filesystem_local_write_file
mcp_filesystem_local_edit_file
mcp_filesystem_local_create_directory
mcp_filesystem_local_move_file
'''


# {'label': '🔗 Workflow（硬流程/工具链）', 'order': 4, 'collapsed': False}
[tool_chains]

# 🔗 启用工具链功能
chains_enabled = true

# 工具链使用说明
chains_guide = "(见插件说明)"

# 工具链名称（英文，如 search_and_summarize）
quick_chain_name = ""

# 工具链描述（供 LLM 理解何时使用）
quick_chain_desc = ""

# 输入参数（每行一个，格式: 参数名=描述）
quick_chain_params = ""

# 执行步骤（每行一个，格式: 工具名|参数JSON|输出键）
quick_chain_steps = ""

# 填写上方信息后，在此输入 ADD 并保存即可添加
quick_chain_add = ""

# 工具链配置模板参考
chains_templates = "(见插件说明)"

# 工具链配置（JSON 数组格式）
chains_list = "[]"

# 当前已注册的工具链状态（只读）
chains_status = "(无工具链配置)"


# {'label': '🔄 ReAct（软流程）', 'order': 5, 'collapsed': True}
[react]

# 🔄 将 MCP 工具注册到记忆检索 ReAct 系统
react_enabled = false

# ReAct 软流程使用说明
react_guide = "(见 config.toml)"

# 过滤模式
# 可选值: whitelist, blacklist
filter_mode = "whitelist"

# 工具过滤列表（每行一个，支持通配符 * 和精确匹配）
tool_filter = ""

# 当前已注册到 ReAct 的工具状态（只读）
react_status = "(启动后自动生成)"


# {'label': '🔐 权限控制', 'order': 21, 'collapsed': True}
[permissions]

# 🔐 按群/用户限制工具使用
perm_enabled = true

# 默认模式：allow_all（默认允许）或 deny_all（默认禁止）
perm_default_mode = "deny_all"

# 禁止使用所有 MCP 工具的群号（每行一个）
quick_deny_groups = ""

# 始终允许使用所有工具的用户 QQ 号（管理员白名单，每行一个）
quick_allow_users = " "

# 高级权限规则（JSON 格式，可针对特定工具配置）
perm_rules = "[]"


# {'label': '🔌 MCP Servers（Claude）', 'order': 3, 'collapsed': False}
[servers]

# Claude Desktop 规范的 MCP 配置（JSON）
claude_config_json = '''
{
  "mcpServers": {

    "fetch-local": {
      "command": "uvx",
      "args": ["mcp-server-fetch"]
    },
    "filesystem-local": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-filesystem", "C:\\", "D:\\"]
    },
    "puppeteer-local": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-puppeteer"]
    }
  }
}
'''

# 配置说明（只读）
claude_config_guide = "(见插件说明)"


