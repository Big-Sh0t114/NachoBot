# mcp_bridge_plugin - 配置文件
# 将 MCP (Model Context Protocol) 服务器的工具桥接到 MaiBot，使麦麦能够调用外部 MCP 工具
# 配置版本: 1.0.0

# {'label': '📖 快速入门', 'order': 1, 'collapsed': False}
[guide]

# 三步开始使用
quick_start = "1. 获取 MCP 服务器  2. 在 MCP Servers 粘贴配置  3. 发送 /mcp reconnect"

# 复制链接到浏览器打开，获取免费 MCP 服务器
mcp_sources = "https://modelscope.cn/mcp | https://smithery.ai | https://glama.ai"

# 复制到 MCP Servers（Claude）可直接使用（免费时间服务器）
example_config = '{"mcpServers":{"time":{"url":"https://mcp.api-inference.modelscope.cn/server/mcp-server-time"}}}'


# {'label': '🔘 插件开关', 'order': 2, 'collapsed': False}
[plugin]

# 是否启用插件
enabled = true


# {'label': '⚙️ 高级设置', 'order': 30, 'collapsed': True}
[settings]

# 🏷️ 工具前缀 - 生成的工具名格式: {前缀}_{服务器名}_{工具名}
tool_prefix = "mcp"

# ⏱️ 连接超时（秒）
connect_timeout = 30.0

# ⏱️ 调用超时（秒）
call_timeout = 60.0

# 🔄 启动时自动连接所有已启用的服务器
auto_connect = true

# 🔁 连接失败时的重试次数
retry_attempts = 3

# ⏳ 重试间隔（秒）
retry_interval = 5.0

# 💓 定期检测服务器连接状态
heartbeat_enabled = true

# 💓 基准心跳间隔（秒）
heartbeat_interval = 60.0

# 🧠 根据服务器稳定性自动调整心跳间隔
heartbeat_adaptive = true

# 稳定服务器的最大间隔倍数
heartbeat_max_multiplier = 3.0

# 🔄 检测到断开时自动尝试重连
auto_reconnect = true

# 🔄 连续重连失败后暂停重连
max_reconnect_attempts = 3

# 📊 定期更新 WebUI 状态显示
status_refresh_enabled = true

# 📊 状态刷新间隔（秒）
status_refresh_interval = 10.0

# 📦 允许读取 MCP 服务器提供的资源
enable_resources = false

# 📝 允许使用 MCP 服务器提供的提示模板
enable_prompts = false

# 🔄 使用 LLM 对长结果进行摘要提炼
post_process_enabled = false

# 📏 结果长度超过此值才触发后处理
post_process_threshold = 500

# 📝 LLM 摘要输出的最大 token 数
post_process_max_tokens = 500

# 🤖 指定用于后处理的模型名称
post_process_model = ""

# 📋 后处理提示词模板
post_process_prompt = "(见插件说明)"

# 🔍 记录工具调用详情
trace_enabled = true

# 内存中保留的最大记录数
trace_max_records = 50

# 是否将追踪记录写入日志文件
trace_log_enabled = false

# 🗄️ 缓存相同参数的调用结果
cache_enabled = false

# 缓存有效期（秒）
cache_ttl = 300

# 最大缓存条目数（超出后 LRU 淘汰）
cache_max_entries = 200

# 不缓存的工具（每行一个，支持通配符 *）
cache_exclude_tools = ""


# {'label': '🔧 工具管理', 'order': 20, 'collapsed': True}
[tools]

# 当前已注册的 MCP 工具列表（只读）
tool_list = '''
📦 fetch-local (1个工具):
  • mcp_fetch_local_fetch

📦 filesystem-local (14个工具):
