[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nachobot-desktop-pet-adapter"
version = "0.1.0"
description = "Backend-neutral desktop pet runtime with optional Live2D and Sprite renderers for NachoBot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5",
    "pillow>=10",
    "pystray>=0.19.5,<0.20; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "websockets>=11,<17",
    "loguru",
    "aiohttp>=3.11,<4",
    "mss>=9,<11",
    "sounddevice>=0.5,<0.6; sys_platform == 'win32'",
]

[project.scripts]
desktop-pet-adapter = "desktop_pet_adapter.__main__:main"
nachobot-desktop-pet-adapter = "desktop_pet_adapter.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["desktop_pet_adapter"]
exclude = ["desktop_pet_adapter/assets/nachobot_chibi/character-reference.png"]

[tool.hatch.build.targets.wheel.force-include]
"desktop_pet_adapter/assets/nachobot_chibi/manifest.json" = "desktop_pet_adapter/assets/nachobot_chibi/manifest.json"
"desktop_pet_adapter/assets/nachobot_chibi/sprites.png" = "desktop_pet_adapter/assets/nachobot_chibi/sprites.png"
"desktop_pet_adapter/assets/nachobot_chibi/sprites-left.png" = "desktop_pet_adapter/assets/nachobot_chibi/sprites-left.png"
"desktop_pet_adapter/assets/nachobot_chibi/sprites-held.png" = "desktop_pet_adapter/assets/nachobot_chibi/sprites-held.png"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
